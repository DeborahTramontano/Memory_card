<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Memory Game PWA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2196f3">
  <style>
    body { font-family: Arial; text-align: center; background: #f0f0f0; }
    h1 { margin-top: 20px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 80px);
      gap: 10px;
      justify-content: center;
      margin: 20px auto;
    }
    .card {
      width: 80px;
      height: 80px;
      font-size: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ddd;
      cursor: pointer;
      border-radius: 10px;
      transition: background 0.3s;
    }
    .flipped { background: #fff; }
    button { margin-top: 20px; padding: 10px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>

<h1>Memory Game</h1>
<p>Mosse: <span id="moves">0</span></p>
<p>Best Score: <span id="best">-</span></p>

<div class="grid" id="grid"></div>
<button onclick="startGame()">Nuova Partita</button>

<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js');
  }
</script>
</body>
</html>
